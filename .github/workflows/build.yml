name: Build .deb

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]   # Debian 12 and 13
    runs-on: ubuntu-latest
    container: debian:${{ matrix.debian }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential debhelper dpkg-dev \
            python3 python3-gi gir1.2-glib-2.0

      - uses: actions/checkout@v4

      - name: Build package (runs the tests too)
        run: |
          dpkg-buildpackage -us -uc -b 2>&1 | tee build.log; test "${PIPESTATUS[0]}" -eq 0
          mkdir -p out
          cp ../hpr-radio_*_all.deb out/

      - name: Install it and start the app once
        run: |
          apt-get install -y --no-install-recommends ./out/hpr-radio_*_all.deb \
            xvfb xauth dbus dbus-x11 adwaita-icon-theme
          hpr-radio --version
          export HPR_AUDIO_SINK=fakesink
          set +e
          timeout 20 xvfb-run -a dbus-run-session -- hpr-radio > app.log 2>&1
          set -e
          cat app.log
          if grep -q "Traceback" app.log; then echo "The app crashed on ${{ matrix.debian }}"; exit 1; fi

      # Plays the real HPR streams (silently), loads real song histories, album art and
      # Good 'N Country pages, and takes screenshots. Network hiccups don't fail the build.
      - name: Screenshots against the live HPR services
        continue-on-error: true
        run: |
          apt-get install -y --no-install-recommends imagemagick
          timeout 120 xvfb-run -a -s "-screen 0 460x820x24" dbus-run-session -- \
            python3 tools/ci_screenshots.py screenshots 2>&1 | grep -v "a11y" | tee live.log

      - uses: actions/upload-artifact@v4
        with:
          name: hpr-radio-deb-${{ matrix.debian }}
          path: out/*.deb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.debian }}
          path: |
            screenshots/*.png
            live.log
            app.log
            build.log

      # Same results, as a branch per Debian release (easier to look at than zipped artifacts).
      - name: Publish results to the ci-results-${{ matrix.debian }} branch
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p /tmp/results && cp -r screenshots live.log app.log build.log /tmp/results/ 2>/dev/null || true
          cd /tmp/results
          git init -q -b results && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "CI results for ${GITHUB_SHA::7} on ${{ matrix.debian }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results:ci-results-${{ matrix.debian }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hpr-radio-deb-bookworm
      - name: Publish the .deb as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" hpr-radio_*_all.deb -R "${{ github.repository }}" \
            --title "HPR Radio ${GITHUB_REF_NAME#v}" \
            --notes "Download hpr-radio_*_all.deb below, then: sudo apt install ./hpr-radio_*_all.deb  (Debian 12/13, Ubuntu 24.04+, Raspberry Pi OS)"
